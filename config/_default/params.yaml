# ══════════════════════════════════════════════════════════════════════════════
# HUGO BLOX CONFIGURATION
# Schema: hugoblox.com/schema/v2
# Tutorial: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  # ────────────────────────────────────────────────────────────────────────────
  # IDENTITY
  # Site-level branding (for the personal profile, see data/authors/admin.yaml)
  # ────────────────────────────────────────────────────────────────────────────
  identity:
    name: "Guillem Hurault"
    # Legal entity for copyright notices (defaults to name if not set)
    organization: ""
    # Schema.org type for structured data
    type: person # person | organization | local_business
    tagline: ""
    description: "Guillem Hurault personal website"
    social:
      twitter: "ghurault" # Twitter/X handle for Twitter Cards (without @)

  # ────────────────────────────────────────────────────────────────────────────
  # THEME
  # Color and visual design system
  # ────────────────────────────────────────────────────────────────────────────
  theme:
    # Mode: 'light', 'dark', or 'system' (follows OS preference)
    mode: system
    # Theme pack: name from data/themes/ in the blox module
    pack: "minimal"
    colors:
      primary: ""
      secondary: ""
      neutral: ""

  # ────────────────────────────────────────────────────────────────────────────
  # TYPOGRAPHY
  # ────────────────────────────────────────────────────────────────────────────
  typography:
    # `system` uses the OS's native font stack (equivalent to the old
    # `appearance.font: native`). Other packs: academic, editorial, modern, ...
    pack: "system"

  # ────────────────────────────────────────────────────────────────────────────
  # LAYOUT
  # ────────────────────────────────────────────────────────────────────────────
  layout:
    # Border radius: 'none', 'sm', 'md', 'lg', or 'full'
    radius: "md"
    # Spacing density: 'compact', 'comfortable', or 'spacious'
    spacing: "spacious"
    avatar_shape: circle # circle | square | rounded

  # ────────────────────────────────────────────────────────────────────────────
  # HEADER
  # ────────────────────────────────────────────────────────────────────────────
  header:
    enable: true
    style: navbar # navbar | navbar-simple | minimal
    sticky: true
    align: left # left | center | right
    search: true
    theme_toggle: true
    # Lets visitors pick any theme pack; off to keep the site's own look.
    theme_picker: false
    # Single-language site.
    language_switcher: false
    cta:
      enable: false
      text: ""
      url: ""

  # ────────────────────────────────────────────────────────────────────────────
  # FOOTER
  # ────────────────────────────────────────────────────────────────────────────
  footer:
    style: minimal # minimal | columns | centered
    language_switcher: false
    text: ""

  # ────────────────────────────────────────────────────────────────────────────
  # COPYRIGHT
  # ────────────────────────────────────────────────────────────────────────────
  copyright:
    # Supports {year}, {name} and {license} placeholders.
    notice: "© {year} {name}. This work is licensed under {license}"
    license:
      type: cc # cc | custom
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  # ────────────────────────────────────────────────────────────────────────────
  # SEO
  # ────────────────────────────────────────────────────────────────────────────
  seo:
    # Browser tab title override (defaults to identity.name if not set)
    title: ""
    # AI/LLM crawler guidance (llms.txt)
    ai:
      allow:
        - /
      disallow: []
      note: "Guidance for AI crawlers - customize to match your public content."
      contact: ""

  # ────────────────────────────────────────────────────────────────────────────
  # CONTENT
  # ────────────────────────────────────────────────────────────────────────────
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: apa # apa | mla | chicago | ieee

  # ────────────────────────────────────────────────────────────────────────────
  # SEARCH
  # Backed by Pagefind: the index is generated by `pnpm run pagefind` after the
  # Hugo build, so search is empty when running `hugo server` locally.
  # ────────────────────────────────────────────────────────────────────────────
  search:
    enable: true
    suggestions: []
    quick_actions: []

  # ────────────────────────────────────────────────────────────────────────────
  # COMMENTS
  # ────────────────────────────────────────────────────────────────────────────
  comments:
    enable: false

  # ────────────────────────────────────────────────────────────────────────────
  # ANALYTICS
  # ────────────────────────────────────────────────────────────────────────────
  analytics:
    google:
      measurement_id: "G-DYGYFM7T03" # Google Analytics 4: G-XXXXXXXXXX

  # ────────────────────────────────────────────────────────────────────────────
  # VERIFICATION
  # ────────────────────────────────────────────────────────────────────────────
  verification:
    google: ""
    bing: ""

  # ────────────────────────────────────────────────────────────────────────────
  # REPOSITORY
  # Source code repository for "Edit this page" links
  # ────────────────────────────────────────────────────────────────────────────
  repository:
    enable: true
    url: "https://github.com/ghurault/ghurault.github.io"
    branch: main
    content_dir: content

  # ────────────────────────────────────────────────────────────────────────────
  # LOCALE
  # ────────────────────────────────────────────────────────────────────────────
  locale:
    date_format: "02 Jan 2006" # Go time format
    time_format: "15:04"
    address_format: en-gb

  # ────────────────────────────────────────────────────────────────────────────
  # PRIVACY
  # ────────────────────────────────────────────────────────────────────────────
  privacy:
    enable: true
    anonymize_analytics: true

  # ────────────────────────────────────────────────────────────────────────────
  # DEBUG
  # ────────────────────────────────────────────────────────────────────────────
  debug:
    enable: false

  # ────────────────────────────────────────────────────────────────────────────
  # PREMIUM
  # ────────────────────────────────────────────────────────────────────────────
  pro:
    # Keep the "Powered by HugoBlox" attribution to support the open source project.
    hide_attribution: false
    affiliate_code: ""
